services:
  # The active API uses MongoDB via Prisma. Prisma wraps writes in
  # transactions, so MongoDB must run as a replica set even in development.
  mongo:
    image: mongo:7
    container_name: ponnaloy-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot initialiser: creates the single-node replica set the first time.
  mongo-init:
    image: mongo:7
    container_name: ponnaloy-mongo-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - mongosh
      - --host
      - mongo:27017
      - --quiet
      - --eval
      - |
        try {
          rs.status();
          print("replica set already initialised");
        } catch (e) {
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
          print("replica set initialised");
        }

  redis:
    image: redis:7-alpine
    container_name: ponnaloy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: ponnaloy-search
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ponnaloy_master_key
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data

volumes:
  mongo_data:
  redis_data:
  meili_data:
